name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Swift + Python tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Swift build
        run: swift build

      - name: Swift tests and live backend contracts
        env:
          TRANSIT_LIVE_CONTRACTS: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          export TRANSIT_TEST_PYTHON="$(command -v python)"
          swift test

      - name: Python tests
        run: python -m pytest python_tests/ -q
