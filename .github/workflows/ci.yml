name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Swift + Python tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Swift build
        run: swift build

      - name: Swift tests
        run: swift test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Python tests
        run: python -m pytest python_tests/ -q

      - name: Backend smoke checks
        run: |
          python Sources/TransitStudio/Resources/backend/transit_calc.py \
            < Examples/sample-request.json > /dev/null
          for sample in classical scan horary vedic-ai harmonic synastry modern-solar-return modern-lunar-return modern-mercury-return modern-timing midpoint modern-timing-midpoint modern-timing-composite modern-timing-davison progressed-composite relocation modern-cycles declination-timing retrograde-cycles classical-visibility planetary-synodic hellenistic-condition-audit draconic-heliocentric classical-derivatives astrocartography local-space mundane-electional orbital-dial prenatal-parans distributions-pd primary-directions-audit method-families time-lords-extended; do
            echo "smoke: $sample"
            python Sources/TransitStudio/Resources/backend/transit_calc.py \
              < "Examples/sample-${sample}-request.json" > /dev/null
          done
          echo '{"mode":"rectify","birth_date":"2000-01-01","center_time":"12:00","timezone":"Asia/Shanghai","latitude":31.23,"longitude":121.47,"house_system":"whole_sign","zodiac":"tropical","bounds_system":"egyptian","triplicity_system":"dorothean","max_age":30,"window_minutes":5,"step_minutes":5}' \
            | python Sources/TransitStudio/Resources/backend/transit_calc.py 2>/dev/null \
            | python -c 'import json,sys; data=json.load(sys.stdin); assert data.get("total_candidates") == 3'
