name: CI

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: Swift + Python tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Swift build
        run: swift build

      - name: Swift tests
        run: swift test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Python tests
        run: python -m pytest python_tests/ -q

      - name: Backend smoke checks
        run: |
          for sample in classical scan horary vedic-ai synastry modern-solar-return modern-lunar-return modern-timing midpoint modern-timing-midpoint modern-timing-composite modern-timing-davison progressed-composite relocation modern-cycles astrocartography local-space; do
            echo "smoke: $sample"
            python Sources/TransitStudio/Resources/backend/transit_calc.py \
              < "Examples/sample-${sample}-request.json" > /dev/null
          done
